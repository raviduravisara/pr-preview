name: preview-deploy

# This repository uses its own tool. The example guestbook is deployed for every
# pull request through the reusable workflow in .github/workflows/preview.yml —
# the same call any other repository would make.

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: preview-${{ github.event.number }}
  cancel-in-progress: true

# A called workflow cannot request more than the caller holds, and this repository
# defaults to read-only tokens.
permissions:
  contents: read
  packages: write
  pull-requests: write

jobs:
  preview:
    uses: ./.github/workflows/preview.yml
    with:
      domain: ravidu.space
      app-path: ./examples/guestbook
      app-port: 8080
      database: postgres
      seed-file: guestbook-postgres.sql
      # Use the chart from this PR's branch rather than main, so chart changes are
      # exercised by the PR that makes them.
      chart-ref: ${{ github.event.pull_request.head.sha }}
    secrets: inherit
