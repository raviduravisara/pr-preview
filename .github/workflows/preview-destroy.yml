name: preview-destroy

on:
  pull_request:
    types: [closed]

jobs:
  destroy:
    runs-on: self-hosted
    permissions:
      contents: read
      pull-requests: write
    defaults:
      run:
        shell: pwsh
    env:
      PR: ${{ github.event.number }}
    steps:
      - name: Uninstall release
        run: helm uninstall pr-${{ env.PR }} --namespace pr-${{ env.PR }} --wait
        continue-on-error: true

      - name: Delete namespace
        run: kubectl delete namespace pr-${{ env.PR }} --ignore-not-found

      - name: Comment
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: preview
          message: |
            **Preview environment destroyed**

            Namespace `pr-${{ env.PR }}` and all its resources have been removed.
