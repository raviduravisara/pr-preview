apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "preview.name" . }}
  labels:
    {{- include "preview.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.app.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/component: app
      {{- include "preview.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: app
        {{- include "preview.selectorLabels" . | nindent 8 }}
    spec:
      {{- if .Values.image.pullSecret }}
      imagePullSecrets:
        - name: {{ .Values.image.pullSecret }}
      {{- end }}
      containers:
        - name: app
          image: "{{ required "image.repository is required" .Values.image.repository }}:{{ required "image.tag is required" .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.app.port }}
          env:
            - name: PR_NUMBER
              value: {{ .Values.prNumber | quote }}
            - name: GIT_SHA
              value: {{ .Values.gitSha | quote }}
            - name: PORT
              value: {{ .Values.app.port | quote }}
            {{- if include "preview.database.enabled" . }}
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: database, key: url } }
            {{- end }}
            {{- range $key, $value := .Values.app.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          {{- if .Values.app.healthPath }}
          readinessProbe:
            httpGet:
              path: {{ .Values.app.healthPath }}
              port: http
          livenessProbe:
            httpGet:
              path: {{ .Values.app.healthPath }}
              port: http
            initialDelaySeconds: 5
          {{- end }}
          resources:
            {{- toYaml .Values.app.resources | nindent 12 }}
