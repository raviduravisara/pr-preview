{{- if .Values.postgres.enabled }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace "postgres" }}
{{- $password := "" }}
{{- if $existing }}
{{- $password = index $existing.data "password" | b64dec }}
{{- else }}
{{- $password = randAlphaNum 24 }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: postgres
  labels:
    {{- include "preview.labels" . | nindent 4 }}
type: Opaque
stringData:
  username: {{ .Values.postgres.user | quote }}
  password: {{ $password | quote }}
  database: {{ .Values.postgres.database | quote }}
  url: "postgres://{{ .Values.postgres.user }}:{{ $password }}@postgres:5432/{{ .Values.postgres.database }}?sslmode=disable"
{{- end }}
