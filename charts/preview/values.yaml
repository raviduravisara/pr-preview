prNumber: ""
gitSha: dev
bgColor: "#1a4d8f"

image:
  repository: pr-preview-app
  tag: dev
  pullPolicy: IfNotPresent

replicaCount: 1

ingress:
  # Full host is <prefix><prNumber><suffix>.<domain>
  # Single subdomain level keeps it inside Cloudflare's free wildcard certificate.
  domain: ravidu.space
  prefix: pr-
  suffix: -preview

resources:
  requests:
    cpu: 10m
    memory: 16Mi
  limits:
    memory: 64Mi
