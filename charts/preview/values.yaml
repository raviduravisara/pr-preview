prNumber: ""
gitSha: dev
bgColor: "#1e7a3c"

image:
  repository: pr-preview-app
  tag: dev
  pullPolicy: IfNotPresent

replicaCount: 1

ingress:
  # Full host is <prefix><prNumber><suffix>.<domain>
  # Single subdomain level keeps it inside Cloudflare's free wildcard certificate.
  domain: ravidu.space
  prefix: pr-
  suffix: -preview

resources:
  requests:
    cpu: 10m
    memory: 16Mi
  limits:
    memory: 64Mi

# Ceiling for one preview environment. Sized with headroom over the app + postgres
# requests below so the seed job, which runs alongside both, still fits.
quota:
  enabled: true
  pods: 10
  requests:
    cpu: "1"
    memory: 512Mi
  limits:
    memory: 1Gi
  # Applied to any container that does not set its own.
  defaultRequests:
    cpu: 10m
    memory: 16Mi
  defaultLimits:
    memory: 128Mi

postgres:
  enabled: true
  image: postgres:17-alpine
  user: preview
  database: preview
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 256Mi
